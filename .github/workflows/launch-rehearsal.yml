# Rehearses the launch, one day before it happens.
#
# Runs at 05:30 UTC on 19 September 2026, which is 11:00 IST, 24 hours before the
# real launch. It checks everything the real run depends on and pushes NOTHING.
# This file can never publish the site: it only ever uses --dry-run.
#
# If it fails, GitHub emails the repository owner. A failure a day early is the
# whole point: there is still time to fix it.
#
# After the launch has happened, delete this file.

name: Rehearse the launch

on:
  schedule:
    - cron: '30 5 19 9 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Rehearse the fast-forward
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin launch:refs/remotes/origin/launch

          if git merge-base --is-ancestor origin/launch HEAD; then
            echo "main already contains launch. The site has been published already."
            echo "ALREADY_LAUNCHED=yes" >> "$GITHUB_ENV"
            exit 0
          fi

          if ! git merge-base --is-ancestor HEAD origin/launch; then
            echo "::error::main has commits that launch does not have, so the launch cannot fast-forward."
            echo "::error::Merge main into launch, then run this again."
            exit 1
          fi

          git merge --ff-only origin/launch
          git push --dry-run origin main
          echo "The fast-forward applies and the token may push."

      - name: Check the site the launch would publish
        if: env.ALREADY_LAUNCHED != 'yes'
        run: |
          set -euo pipefail
          missing=0
          for f in index.html events.html 404.html countdown.html unveiling.html \
                   robots.txt sitemap.xml llms.txt CNAME data/club.js \
                   images/og.jpg fonts/jost.woff2; do
            if [ ! -s "$f" ]; then echo "::error::missing or empty: $f"; missing=1; fi
          done
          [ "$(cat CNAME)" = "lcoaurelian.in" ] || { echo "::error::CNAME is not lcoaurelian.in"; missing=1; }
          grep -q 'lcoaurelian.in/images/og.jpg' index.html || { echo "::error::the share image tag is not absolute"; missing=1; }
          grep -q '<link rel="canonical" href="https://lcoaurelian.in/">' index.html || { echo "::error::the home page has no canonical link"; missing=1; }
          grep -q 'noindex' countdown.html || { echo "::error::the archived countdown is not noindex"; missing=1; }
          exit $missing

      - name: Summary
        if: always()
        run: |
          {
            echo "### Launch rehearsal"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "Everything is ready. The real run is scheduled for 11:00 IST on 20 September."
            else
              echo "Something is wrong. Read the failed step above. Nothing was published either way."
            fi
            echo ""
            echo "main:   \`$(git rev-parse --short origin/main)\`"
            echo "launch: \`$(git rev-parse --short origin/launch)\`"
          } >> "$GITHUB_STEP_SUMMARY"
